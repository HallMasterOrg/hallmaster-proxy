services:
  hallmaster-robojs-mock:
    image: hallmaster-robojs-mock
    build:
      context: ./robojs-mock
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - hallmaster-proxy-net
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--enable-source-maps
      - ROBO_MOCK_MODE=true
      - ROBO_MOCK_SESSION_ID=sess_rgrxeOVvFaeLgJBe
    volumes:
      - flashcore-data:/app/.robo/flashcore

  hallmaster-proxy:
    depends_on:
      - hallmaster-robojs-mock
    build:
      context: proxy/
      dockerfile: Dockerfile
    container_name: hallmaster-proxy
    restart: "no"
    environment:
      PROXY_HOSTNAME: hallmaster-proxy
      PROXY_PORT: 443
      PROXY_HEALTH_PORT: 8081
      PROXY_SSL_CA_CERT_PATH: "/app/cert/proxy-ca.crt"
      PROXY_SSL_CA_KEY_PATH: "/app/cert/proxy-ca.pem"
      PROXY_DNS_SERVER: 8.8.8.8:53
      TEST_ENV: true
    volumes:
      - ./certs/hallmaster-rootca.crt:/app/cert/proxy-ca.crt:ro
      - ./certs/hallmaster-rootca.pem:/app/cert/proxy-ca.pem:ro
    networks:
      hallmaster-proxy-net:
        aliases:
          - discord.com
          - discord.gg
          - gateway.discord.gg
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:$${PROXY_HEALTH_PORT}/healthz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  discord-bot:
    depends_on:
      - hallmaster-proxy
    image: testing-bot
    build:
      context: ./testing-bot
      dockerfile: Dockerfile
    environment:
      # Talks to the real Discord, so it needs a real token: taken from the
      # shell or the git-ignored root .env. Unset only breaks this service.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      TOTAL_SHARDS: 2
      SHARD_ID_LIST: "0,1"
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/hallmaster-root-ca.crt
      NODE_USE_ENV_PROXY: "1"
    restart: "no"
    networks:
      - hallmaster-proxy-net
    volumes:
      - ./certs/hallmaster-rootca.crt:/usr/local/share/ca-certificates/hallmaster-root-ca.crt:ro

networks:
  hallmaster-proxy-net:

volumes:
  flashcore-data:
