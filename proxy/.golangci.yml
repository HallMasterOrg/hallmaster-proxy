version: "2"

# v2's "standard" set is errcheck, govet, ineffassign, staticcheck, unused.
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (net.Conn).Close
        - (*crypto/tls.Conn).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - fmt.Fprintf
        - (net/http.ResponseWriter).Write

formatters:
  enable:
    - gofmt
    - goimports
